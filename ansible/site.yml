---
- name: Provision the web server
  hosts: www_public
  gather_facts: false
  vars:
    contact_bind_address: 127.0.0.1
    contact_port: 8080
  pre_tasks:
    - name: Wait for the host to accept ssh connections
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: common
    - role: storage
    - role: www-public
      www_public_email: pelle@pelle.io
      www_public_reverse_proxies:
        - name: contact.solidblocks.de
          domains:
            - contact.solidblocks.de
          upstream: "{{ contact_bind_address }}:{{ contact_port }}"
    - role: contact
      contact_smtp_host: "{{ lookup('community.general.passwordstore', 'solidblocks/scaleway/tem/smtp_host') }}"
      contact_smtp_port: "{{ lookup('community.general.passwordstore', 'solidblocks/scaleway/tem/smtp_port') }}"
      contact_smtp_username: "{{ lookup('community.general.passwordstore', 'solidblocks/scaleway/tem/smtp_user') }}"
      contact_smtp_password: "{{ lookup('community.general.passwordstore', 'solidblocks/scaleway/tem/smtp_password') }}"
