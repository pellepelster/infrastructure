---
- name: Check that the inventory supplied the list of sites
  ansible.builtin.assert:
    that:
      - www_public_sites is sequence
      - www_public_sites is not string
      - www_public_sites | length > 0
      - www_public_sites | map(attribute='name') | list | length == www_public_sites | length
      - www_public_sites | map(attribute='domains') | list | length == www_public_sites | length
    fail_msg: >-
      www_public_sites must be a non-empty list of {name, domains} entries. The
      inventory is generated by terraform (terraform/www-public/ansible.tf) -
      run terraform apply first.
    quiet: true

- name: Install packages needed to consume the Caddy apt repository
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - debian-archive-keyring
      - debian-keyring
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: "{{ www_public_apt_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Caddy apt repository signing key
  ansible.builtin.get_url:
    url: "{{ www_public_apt_key_url }}"
    dest: "{{ www_public_apt_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Add the Caddy apt repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    uris: "{{ www_public_apt_repository }}"
    suites: any-version
    components: main
    signed_by: "{{ www_public_apt_keyring }}"
  register: www_public_apt_repository_result

- name: Remove the sources.list.d entry superseded by the deb822 source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/caddy-stable.list
    state: absent

- name: Update the apt cache when the repository changed
  ansible.builtin.apt:
    update_cache: true
  when: www_public_apt_repository_result is changed

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Include the caddy repository in unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-caddy
    content: |
      Unattended-Upgrade::Origins-Pattern:: "origin=cloudsmith/caddy/stable";
    owner: root
    group: root
    mode: "0644"

- name: Create the storage root
  ansible.builtin.file:
    path: "{{ www_public_storage_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the site roots
  ansible.builtin.file:
    path: "{{ www_public_storage_dir }}/{{ site.name }}/html"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ www_public_sites }}"
  loop_control:
    loop_var: site

- name: Create the log directory
  ansible.builtin.file:
    path: "{{ www_public_log_dir }}"
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"

- name: Create the per site access logs
  ansible.builtin.file:
    path: "{{ www_public_log_dir }}/{{ site.name }}.access.log"
    state: touch
    owner: caddy
    group: caddy
    mode: "0640"
    access_time: preserve
    modification_time: preserve
  loop: "{{ www_public_sites + www_public_reverse_proxies }}"
  loop_control:
    loop_var: site

- name: Seed a placeholder index page for sites without content
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ www_public_storage_dir }}/{{ site.name }}/html/index.html"
    owner: root
    group: root
    mode: "0644"
    force: false
  loop: "{{ www_public_sites }}"
  loop_control:
    loop_var: site
  when: www_public_manage_index | bool

- name: Deploy the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: "caddy validate --adapter caddyfile --config %s"
  notify: Reload caddy

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
