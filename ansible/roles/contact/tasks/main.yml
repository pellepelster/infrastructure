---
- name: Check that the smtp credentials were supplied
  ansible.builtin.assert:
    that:
      - contact_smtp_host | length > 0
      - contact_smtp_port | string | length > 0
      - contact_smtp_username | length > 0
      - contact_smtp_password | length > 0
    fail_msg: >-
      The smtp credentials are not set. They are read from pass by the playbook
      (site.yml) - check that solidblocks/scaleway/tem/* exists in the password
      store.
    quiet: true

- name: Install podman
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allocate subordinate ids for user namespaces
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: "containers:2147483648:1048576"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/subuid
    - /etc/subgid
  notify: Restart contact

- name: Create the environment file directory
  ansible.builtin.file:
    path: "{{ contact_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy the environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ contact_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart contact

- name: Create the quadlet directory
  ansible.builtin.file:
    path: "{{ contact_quadlet_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the quadlet unit
  ansible.builtin.template:
    src: contact.container.j2
    dest: "{{ contact_quadlet_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart contact

- name: Start the contact container
  ansible.builtin.systemd:
    name: contact.service
    state: started
    daemon_reload: true
