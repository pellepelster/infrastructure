---
- name: Check that the inventory supplied the storage device
  ansible.builtin.assert:
    that:
      - storage_device is string
      - storage_device | length > 0
    fail_msg: >-
      storage_device is not set. The inventory is generated by terraform
      (terraform/www-public/ansible.tf) - run terraform apply first.
    quiet: true

- name: Wait for the volume to appear
  ansible.builtin.wait_for:
    path: "{{ storage_device }}"
    timeout: 60

- name: Create the filesystem
  community.general.filesystem:
    dev: "{{ storage_device }}"
    fstype: "{{ storage_fstype }}"

- name: Create the mount point
  ansible.builtin.file:
    path: "{{ storage_mount_point }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mount the volume
  ansible.posix.mount:
    path: "{{ storage_mount_point }}"
    src: "{{ storage_device }}"
    fstype: "{{ storage_fstype }}"
    opts: "{{ storage_mount_opts }}"
    state: mounted
