# yaml-language-server: $schema=https://solidblocks.de/blcks-cloud.schema.json
---
name: pelle
root_domain: pelle.io

providers:
  - type: pass
  - type: ssh_key
    private_key: ~/.ssh/pelle.io.ed25519.key
  - type: hcloud
  - type: backup_local

services:
  - type: s3
    name: public
    buckets:
      - name: pelle.io
        public_access: true
        public_access_domains:
            - pelle.io
        access_keys:
          - name: "admin"
            owner: true
            read: true
            write: true
      - name: solidblocks.de
        public_access: true
        public_access_domains:
            - solidblocks.de
        access_keys:
          - name: "admin"
            owner: true
            read: true
            write: true
  - type: docker
    name: solidblocks-contact
    image: ghcr.io/pellepelster/solidblocks-contact:fceb202f63539f30d2b930de627ea147fbdadf1b
    use_floating_ip: true
    environment_vars:
      SMTP_HOST: "${secret:solidblocks/scaleway/tem/smtp_host}"
      SMTP_PORT: "${secret:solidblocks/scaleway/tem/smtp_port}"
      SMTP_USERNAME: "${secret:solidblocks/scaleway/tem/smtp_user}"
      SMTP_PASSWORD: "${secret:solidblocks/scaleway/tem/smtp_password}"
      SMTP_RECIPIENT: pelle@pelle.io
      SMTP_FROM: info@tem.solidblocks.de
    endpoints:
      - container_port: 8080
